[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.23"
optimizer = true
optimizer_runs = 200
evm_version = "paris"

[rpc_endpoints]
botchain = "${BOTCHAIN_RPC_URL}"
bohr = "${BOHR_RPC_URL}"

[etherscan]
botchain = { key = "${BOTSCAN_API_KEY}", url = "${BOTSCAN_VERIFIER_URL}", chain = 677 }
bohr = { key = "${BOTSCAN_API_KEY}", url = "${BOHR_VERIFIER_URL}", chain = 968 }
